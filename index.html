<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Interactive 3D Exhibit</title>

  <!-- Google Model Viewer -->
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .header {
      text-align: center;
      padding: 20px;
      background: white;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .viewer-container {
      width: 100%;
      height: 55vh;
      background: #eeeeee;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }

    .content {
      padding: 20px;
      background: white;
    }

    .content h2 {
      margin-top: 0;
    }

    .instruction {
      text-align: center;
      padding: 10px;
      font-size: 14px;
      color: #555;
    }

    .audio-button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

  </style>

</head>


<body>

  <!-- TITLE -->

  <div class="header">

    <h1>Interactive 3D Model</h1>

    <p>Explore the model in three dimensions</p>

  </div>


  <!-- 3D MODEL -->

  <div class="viewer-container">

    <model-viewer
      src="model_webar.glb"

      camera-controls

      touch-action="pan-y"

      auto-rotate

      shadow-intensity="1"

      exposure="1"

      alt="Interactive 3D model">

    </model-viewer>

  </div>


  <!-- INSTRUCTIONS -->

  <div class="instruction">

    Drag to rotate • Pinch to zoom

  </div>


  <!-- INFORMATION -->

  <div class="content">

    <h2>About this Model</h2>

    <p>
      This interactive 3D model allows visitors to examine
      the object from different directions. Rotate and zoom
      the model to explore its structure in detail.
    </p>

    <button class="audio-button">
      🔊 Listen to Explanation
    </button>

  </div>


</body>

</html>
